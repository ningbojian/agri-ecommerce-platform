server.port=8203
spring.application.name=service-sup

# MySQL 8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${XCFP_SUP_DB_URL:jdbc:mysql://127.0.0.1:3306/xcfp_sup?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${XCFP_DB_USER:root}
spring.datasource.password=${XCFP_DB_PASSWORD:change-me}

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:xcfp/**/mapper/xml/*.xml
mybatis-plus.type-aliases-package=xcfp.model
mybatis-plus.configuration.map-underscore-to-camel-case=true

# Shared JWT / internal call token
xcfp.jwt.secret=${XCFP_JWT_SECRET:xcfp-local-dev-secret-please-change-0123456789}
xcfp.jwt.user-expire-seconds=604800
xcfp.jwt.admin-expire-seconds=43200
xcfp.internal-token=${XCFP_INTERNAL_TOKEN:xcfp-local-internal-token}

# Supplier endpoints are admin-only
xcfp.auth.whitelist=/error
xcfp.swagger.enabled=${XCFP_SWAGGER_ENABLED:true}

logging.level.xcfp=info
logging.level.com.baomidou=info
